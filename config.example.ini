; Copy to ~/csfd-config.ini (outside the web root) and fill in.

[scrape_do]
token = YOUR_SCRAPE_DO_TOKEN

[mysql]
host = csfd.db
user = csfd
password = ...
database = csfd

[crawl]
; Requests per second across all workers.
rate = 2
workers = 3
; Stop when scrape.do reports fewer credits than this.
min_credits = 1000
; Stop enumerating user IDs after this many missing IDs in a row.
max_missing_streak = 20000

[web]
; Optional password for the web pages (any user name). Empty = public.
password =
